name: Weekly API Call

on:
  schedule:
    - cron: '0 11 * * 0'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  call-api:
    uses: kkklich/OLXAPI/.github/workflows/call-api.yml@render
    secrets:
      CONNECTIONSTRINGS__CONNECTIONSTRING: ${{ secrets.CONNECTIONSTRINGS__CONNECTIONSTRING }}
