name: Weekly API Call

on:
  schedule:
    - cron: '0 11 * * 0'
      timezone: 'Europe/Warsaw'
  workflow_dispatch:
  workflow_call:
    secrets:
      CONNECTIONSTRINGS__CONNECTIONSTRING:
        required: true

permissions:
  contents: read

concurrency:
  group: weekly-api-scrape
  cancel-in-progress: false

jobs:
  call-api:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name == 'render' && github.sha || 'render' }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build the scraper
        run: dotnet build AF_mobile_web_api/AF_mobile_web_api.csproj --configuration Release
      - name: Download and save offers by city
        env:
          ConnectionStrings__ConnectionString: ${{ secrets.CONNECTIONSTRINGS__CONNECTIONSTRING }}
          Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
          Logging__LogLevel__System.Net.Http.HttpClient: Warning
        run: |
          set -euo pipefail
          if [[ -z "${ConnectionStrings__ConnectionString:-}" ]]; then
            echo "The production database connection secret is missing."
            exit 1
          fi
          cd AF_mobile_web_api
          dotnet bin/Release/net10.0/AF_mobile_web_api.dll --weekly-scrape "$GITHUB_RUN_ID"
