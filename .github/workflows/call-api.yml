name: Weekly API Call

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check access to both OLX cities and database port
        shell: bash
        run: |
          set -euo pipefail
          body=$(mktemp)
          trap 'rm -f "$body"' EXIT
          for city in Krakow:4:8959 Katowice:6:7691; do
            IFS=: read -r name region id <<< "$city"
            url="https://www.olx.pl/api/v1/offers/?offset=0&limit=1&category_id=14&filter_float_price%3Afrom=50000&filter_float_price%3Ato=10000000&region_id=${region}&city_id=${id}"
            code=$(curl -sS --max-time 25 -H 'User-Agent:' -H 'Accept: application/json' -o "$body" -w '%{http_code}' "$url")
            echo "$name HTTP $code"
            if [[ "$code" == 200 ]]; then jq -e '.data | length > 0' "$body"; fi
          done