# Real Estate App - nginx vhost
#
#   /        -> Angular SSR (node)  127.0.0.1:4000
#   /api/    -> .NET API            127.0.0.1:5016
#
# Install:
#   cp realestate.conf /etc/nginx/sites-available/
#   sed -i 's/realestate.example.com/YOUR.DOMAIN/g' /etc/nginx/sites-available/realestate.conf
#   ln -sf /etc/nginx/sites-available/realestate.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d YOUR.DOMAIN        # adds the 443 block + HTTP->HTTPS redirect
#
# This file is intentionally HTTP-only: certbot rewrites it in place once the
# certificate exists. Do not add ssl_certificate paths by hand before then --
# nginx refuses to start when they point at files that do not exist yet.

upstream realestate_ssr {
    server 127.0.0.1:4000;
    keepalive 16;
}

upstream realestate_api {
    server 127.0.0.1:5016;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name realestate.example.com;

    access_log /var/log/nginx/realestate.access.log;
    error_log  /var/log/nginx/realestate.error.log;

    # Scraped pages and map tiles produce large JSON payloads
    client_max_body_size 16m;

    # The API already applies Brotli/Gzip itself (AddResponseCompression in
    # Program.cs); this only covers what nginx serves or what SSR returns plain.
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json
                      application/xml image/svg+xml application/manifest+json;

    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------------------------------------------------------------- API ---
    # Scrape triggers run for minutes (a full multi-city run can take close to
    # an hour). They get their own block so the normal API keeps a sane timeout.
    location ~ ^/api/RealEstate/(getdataForManyCities|loadDataMarkeplaces|morizon|nieruchomosciOnline) {
        proxy_pass http://realestate_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout   30s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
        proxy_buffering         off;
    }

    location /api/ {
        proxy_pass http://realestate_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout  10s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;
    }

    # ------------------------------------------------------------ frontend ---
    # No separate block for the hashed bundles: src/server.ts serves them via
    # express.static({ maxAge: '1y' }), so Cache-Control already comes back
    # correct from upstream. Adding add_header here would also silently drop the
    # server-level security headers, since a location's add_header set replaces
    # the inherited one rather than extending it.
    location / {
        proxy_pass http://realestate_ssr;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout  10s;
        proxy_read_timeout     60s;
    }

    # ---------------------------------------------------------------------
    # Sub-path variant: use this instead of "location /" above when the app is
    # built with --base-href /realestate/ and you want it under
    # https://YOUR.DOMAIN/realestate/ rather than at the domain root.
    #
    # location /realestate/ {
    #     proxy_pass http://realestate_ssr;      # note: no trailing slash --
    #     proxy_http_version 1.1;                # the /realestate/ prefix must
    #     proxy_set_header Host              $host;   # reach the SSR server,
    #     proxy_set_header X-Real-IP         $remote_addr;  # because base href
    #     proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;       # includes it.
    #     proxy_set_header Connection        "";
    # }
    # ---------------------------------------------------------------------
}

# =========================================================================
